<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/TOEIC/icon.svg" />
    <link rel="apple-touch-icon" href="/TOEIC/apple-touch-icon.png" />
    <title>TOEIC 単語トレーナー</title>
    <script>
      // 画面が描かれる前にテーマを反映し、一瞬白く光る（ちらつく）のを防ぐ
      try {
        var t = JSON.parse(localStorage.getItem('toeic-settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
